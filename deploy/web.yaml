# The site and its APIs. One replica, because SQLite has a single writer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  # Stop the old pod before the new one starts: the volume is ReadWriteOnce and migrations run on start.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # The token lets the Refresh button start a researcher Job (rbac.yaml). It can do nothing else.
      serviceAccountName: web
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Kustomize sets the sha-<commit> tag (kustomization.yaml).
          image: ghcr.io/peyhunter/tech-update-web
          ports:
            - name: http
              containerPort: 3000
            - name: internal
              containerPort: 3001
          env:
            - name: PORT
              value: "3000"
            - name: INTERNAL_PORT
              value: "3001"
            - name: DATA_DIR
              value: /data
            - name: PUBLIC_URL
              value: https://tech-update.peytonhunter.com
            - name: REFRESH_COOLDOWN_MIN
              value: "60"
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tech-update-tokens
                  key: INGEST_TOKEN
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tech-update-tokens
                  key: ADMIN_TOKEN
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: tmp
          emptyDir: {}
---
# Port 80 is the public site; 3001 is the researcher's ingest API and is never in the Ingress.
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: internal
      port: 3001
      targetPort: internal

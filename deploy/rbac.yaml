# The web's Refresh button starts a researcher Job, like `kubectl create job --from=cronjob/researcher`.
# The web may read only the researcher CronJob and list or create Jobs in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-refresh
rules:
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [researcher]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-refresh
subjects:
  - kind: ServiceAccount
    name: web
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: web-refresh
